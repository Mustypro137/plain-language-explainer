<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plain-Language Explainer</title>
    <meta
      name="description"
      content="Paste documentation or an error message and get it back in simple English. Save the hard words and practise them with flashcards."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171e" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plain-language-explainer.vercel.app/" />
    <meta property="og:title" content="Plain-Language Explainer" />
    <meta
      property="og:description"
      content="Technical English made simple. Paste docs or an error message, get a clear answer, then learn the hard words."
    />
    <meta property="og:image" content="https://plain-language-explainer.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Plain-Language Explainer: paste the text you do not understand." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Set the theme before the page draws, so dark mode never flashes white.
      // Same rules as currentTheme() in src/lib/theme.js.
      try {
        var saved = localStorage.getItem('ple.theme.v1')
      } catch (e) {}
      document.documentElement.dataset.theme =
        saved === 'light' || saved === 'dark'
          ? saved
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
